<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LostLink Admin Panel</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 16px;
        width: 100%;
        min-height: 100%;
        font-family: Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        overflow-x: hidden;
    }

    h1 {
        margin: 0 0 4px 0;
    }

    h2 {
        margin-top: 20px;
    }

    button {
        padding: 10px 16px;
        margin: 5px 5px 5px 0;
        font-size: 16px;
        cursor: pointer;
    }

    #pendingItems {
        width: 100%;
    }

    #maintenanceStatus {
        margin-top: 10px;
        font-weight: bold;
    }

</style>

</head>

<body>

<h1>LostLink Admin Panel</h1>

<p>Student Lost &amp; Found System</p>

<hr>

<h2>Admin Tools</h2>

<button
    type="button"
    onclick="window.location.assign('./maintenance.html')">
    Open Maintenance Page
</button>

<p id="maintenanceStatus">
    Checking maintenance status...
</p>

<hr>

<script>

async function showMaintenanceStatus() {

    try {

        const response = await fetch(
            "maintenance.json?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        const data = await response.json();

        const status =
            document.getElementById(
                "maintenanceStatus"
            );

        if (data.maintenance === true) {

            status.innerText =
                "Maintenance Mode: ACTIVE";

        } else {

            status.innerText =
                "Maintenance Mode: OFF";

        }

    } catch (error) {

        document.getElementById(
            "maintenanceStatus"
        ).innerText =
            "Could not check maintenance status.";

    }

}

showMaintenanceStatus();

</script>

</body>

</html>
