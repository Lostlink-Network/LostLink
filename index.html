<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LostLink Network System</title>

    <!-- Universal Design font: BIZ UDPGothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap"
          rel="stylesheet">

    <style>
        /* ==================================================
           LOSTLINK EASY SETTINGS
           Beginner-friendly appearance settings.
           Change the values below to customise the website.
           ================================================== */

        :root {
            
/* TOP BAR */
--top-bar-background: #ffffff;
--top-bar-text: #19386A;
--top-bar-border: #ffffff;


            /* BUTTON COLOURS */
            --button-background: #f2f2f2;
            --button-text: #19386A;
            --button-border: #19368A;
            --button-hover-background: #e0e0e0;

            /* LANGUAGE SELECTION COLOUR */
            --language-selected-background: rgba(25, 118, 210, 0.25);

            /* PAGE COLOURS */
            --page-background: #ffffff;
            --page-text: #111111;

            /* SPACING */
            --page-padding: 16px;
            --page-top-padding: 15px;
            --button-radius: 4px;
        }

        /* ==================================================
           GENERAL PAGE SETTINGS
           ================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            scroll-behavior: auto;
            overflow-anchor: none;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: var(--page-top-padding) var(--page-padding) var(--page-padding);
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;

            font-family: "BIZ UDPGothic", "Yu Gothic UI",
                         "Meiryo", sans-serif;
            text-align: left;
            color: var(--page-text);
            background: var(--page-background);
            line-height: 1.6;
        }

        button,
        a,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        a {
            color: inherit;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #1976d2;
            outline-offset: 3px;
        }

        hr {
            border: 0;
            border-top: 1px solid #999999;
            margin: 6px 0;
        }

        h2 {
            margin-top: 8px;
            margin-bottom: 6px;
        }

        #recentTitle {
            margin-top: 8px;
            margin-bottom: 4px;
        }

        /* ==================================================
           TOP BAR
           Change its colours in LOSTLINK EASY SETTINGS.
           ================================================== */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;

            padding: 0 10px 10px 0;
            color: var(--top-bar-text);
            background: var(--top-bar-background);
            border: 1px solid var(--top-bar-border);
            border-radius: var(--button-radius);
        }

        .nexus {
            text-align: left;
            min-width: 0;
        }

        .nexus h1 {
            margin: 0;
            line-height: 1.3;
            overflow-wrap: anywhere;
            font-weight: 2000;
        
        }

        .nexus p {
            margin: 0;
            line-height: 1.5;
        }

        /* ==================================================
           LANGUAGE BUTTONS
           ================================================== */

        .language-box {
            display: flex;
            flex-shrink: 0;
            border: 1px solid var(--button-border);
            border-radius: var(--button-radius);
            margin-left: 10px;
            overflow: hidden;
        }

        .language-box button {
            border: none;
            background: var(--button-background);
            color: var(--button-text);
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            min-height: 40px;
        }

        .language-box button.selected {
            background: var(--language-selected-background);
            color: var(--button-text);
            font-weight: 700;
        }

        .language-box button:hover {
            background: var(--button-hover-background);
        }

        .language-box button.selected:hover {
            background: var(--language-selected-background);
        }

        /* ==================================================
           NAVIGATION BUTTONS
           Links remain real links for accessibility.
           Their appearance is changed to buttons.
           ================================================== */

        .menu-list {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            margin: 8px 0;
        }

        .nav-button {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;

            min-height: 25px;
            max-width: 100%;
            padding: 5px 10px;

            background: var(--button-background);
            color: var(--button-text);
            border: 1px solid var(--button-border);
            border-radius: var(--button-radius);

            text-decoration: none;
            overflow-wrap: anywhere;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .nav-button:hover {
            background: var(--button-hover-background);
            text-decoration: underline;
        }

        /* ==================================================
           RECENT ITEMS
           Keep these styles compatible with script.js.
           ================================================== */

        #latestItems {
            width: 100%;
            overflow-wrap: anywhere;
        }

        #latestItems img {
            max-width: 100%;
            height: auto;
        }

        #loadingText {
            opacity: 0.7;
        }

        /* ==================================================
           VERSION LABEL
           ================================================== */

        .version-label {
            text-align: center;
            margin-top: 30px;
            padding: 10px;
            font-size: 12px;
            opacity: 0.6;
        }

        .debug-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 450px);
            max-height: 70vh;
            overflow-y: auto;
            background: white;
            color: #222;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 16px;
            z-index: 999999;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.25);
            font-size: 13px;
        }

        .debug-popup.active {
            display: block;
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        #translationDebugLog {
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        /* ==================================================
           MOBILE LAYOUT
           ================================================== */

        @media (max-width: 600px) {
            :root {
                --page-padding: 12px;
            }

            .top-bar {
                gap: 8px;
                padding: 0 8px 8px 0;
            }

            .nexus h1 {
                font-size: 1.5rem;
            }

            .nexus p {
                font-size: 0.9rem;
            }

            .language-box {
                margin-left: 0;
            }

            .language-box button {
                padding: 8px 10px;
            }

            .nav-button {
                width: 100%;
            }
        }

        /* Respect users who prefer reduced motion. */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>

    <link rel="stylesheet" href="site-theme.css">

    <script>
        // Prevent the browser from restoring an old scroll position.
        if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
        }
    </script>
</head>

<body>

    <!-- TOP BAR -->
    <header class="top-bar">

        <div class="nexus">
            <h1><a href="index.html" id="lostlinkTitle">LostLink NTW</a></h1>
            <p id="subTitle">Student Lost &amp; Found System</p>
        </div>

        <div class="language-box" aria-label="Language selection">
            <button
                type="button"
                id="enButton"
                onclick="setLanguage('EN')"
                aria-label="Switch to English">
                EN
            </button>

            <button
                type="button"
                id="jpButton"
                onclick="setLanguage('JP')"
                aria-label="日本語に切り替え">
                JP
            </button>
        </div>

    </header>

    <hr>

    <!-- MAIN MENU -->
    <main>

       <h2 id="menuTitle">Menu</h2>

        <nav class="menu-list" aria-label="Main menu">
            <a class="nav-button" href="search.html" id="menuSearch">
                Search for an item
            </a>

            <a class="nav-button" href="report.html" id="menuReport">
                Report a lost/found item
            </a>

            <a class="nav-button" href="latest.html" id="menuLatest">
                View Latest Items
            </a>
        </nav>

        <hr>

        <!-- RECENTLY FOUND ITEMS -->
        <section class="recent-items-section" aria-labelledby="recentTitle">
            <h2 id="recentTitle">Recently Found Items</h2>

            <hr>

            <div id="latestItems">
                <p id="loadingText" role="status" aria-live="polite">
                    Loading...
                </p>
            </div>

            <p>
                <a class="nav-button" href="latest.html" id="viewAllLink">
                    View all latest items →
                </a>
            </p>
        </section>

        <hr id="recentItemsDivider">

        <!-- INFORMATION LINKS -->
        <section aria-label="System information">
            <p>
                <a class="nav-button" href="DEV.html" id="systemDescLink">
                    System Description
                </a>
            </p>

            <p>
                <a class="nav-button" href="TESTFILE2.html" id="systemHistoryLink">
                    System History
                </a>
            </p>

            <hr>

            <p>
                <a class="nav-button" href="Feedback.html" id="feedbackFormLink">
                    Feedback Form
                </a>
            </p>

        </section>

    </main>

    <footer class="version-label">
        GF-02
    </footer>

    <!-- Existing website functionality -->
    <script src="script.js?v=20261030-debug-popup"></script>

    <div id="debugPopup" class="debug-popup">
        <div class="debug-header">
            <strong>LostLink Diagnostics</strong>
            <button type="button" id="closeDebug">Close</button>
        </div>

        <div id="translationDebugLog">Diagnostics ready.</div>
    </div>

</body>
</html>
