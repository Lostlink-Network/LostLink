<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Items - PRJ LostLink</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            width: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
        }

        /* ================================
           TOP BAR
           ================================ */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nexus {
            text-align: left;
        }

        .nexus h1 {
            margin: 0;
            line-height: 1.1;
        }

        .nexus p {
            margin: 0;
            line-height: 1.1;
        }

        /* ================================
           LANGUAGE BUTTONS
           ================================ */

        .language-box {
            display: flex;
            border: 1px solid black;
            margin-left: 10px;
            overflow: hidden;
        }

        .language-box button {
            border: none;
            background: white;
            color: black;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .language-box button.selected {
            background: rgba(25, 118, 210, 0.25);
            color: black;
        }

        /* ================================
           VERSION
           ================================ */

        .version-label {
            text-align: center;
            margin-top: 30px;
            padding: 10px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>

    <link rel="stylesheet" href="site-theme.css">
</head>

<body>

    <!-- ================================
     TOP BAR
     ================================ -->

<div class="top-bar">

<div class="nexus">

    <h1>
        <a id="pageTitle" href="index.html">LostLink NTW</a>
    </h1>

    <p id="subTitle">
        Student Lost &amp; Found System
    </p>

</div>

<div class="language-box">

    <button id="enButton"
        onclick="setLanguage('EN')">
        EN
    </button>

    <button id="jpButton"
        onclick="setLanguage('JP')">
        JP
    </button>

</div>

</div>

    <hr>

    <h2 id="latestTitle">
        Latest Items
    </h2>

    <hr>

    <div id="allLatestItems">
        Loading...
    </div>

    <script src="script.js"></script>

    <div class="version-label">
        GF-00
    </div>

</body>

</html>
