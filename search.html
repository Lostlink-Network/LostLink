<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - PRJ LostLink</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            width: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
        }

        /* ================================
           TOP BAR
           ================================ */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nexus {
            text-align: left;
        }

        .nexus h1 {
            margin: 0;
            line-height: 1.1;
        }

        .nexus p {
            margin: 0;
            line-height: 1.1;
        }

        /* ================================
           LANGUAGE BUTTONS
           ================================ */

        .language-box {
            display: flex;
            border: 1px solid black;
            margin-left: 10px;
            overflow: hidden;
        }

        .language-box button {
            border: none;
            background: white;
            color: black;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .language-box button.selected {
            background: rgba(25, 118, 210, 0.25);
            color: black;
        }

        /* ================================
           SEARCH
           ================================ */

        #searchBox {
            width: 70%;
            max-width: 400px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        #searchButton {
            padding: 10px 16px;
            min-height: 44px;
            font-size: 16px;
            cursor: pointer;
        }

        #results {
            margin-top: 16px;
        }

        @media (max-width: 600px) {
            #searchBox,
            #searchButton {
                width: 100%;
                max-width: none;
            }
        }

        /* ================================
           VERSION
           ================================ */

        .version-label {
            text-align: center;
            margin-top: 30px;
            padding: 10px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>

    <link rel="stylesheet" href="site-theme.css">

</head>

<body>

    <!-- ================================
         TOP BAR
         ================================ -->

    <div class="top-bar">

        <div class="nexus">

            <h1>
                <a id="pageTitle" href="index.html">LostLink NTW</a>
            </h1>

            <p id="subTitle">
                Student Lost &amp; Found System
            </p>

        </div>

        <div class="language-box">

            <button
                id="enButton"
                type="button"
                onclick="setLanguage('EN')"
            >
                EN
            </button>

            <button
                id="jpButton"
                type="button"
                onclick="setLanguage('JP')"
            >
                JP
            </button>

        </div>

    </div>

    <hr>

    <!-- ================================
         SEARCH SECTION
         ================================ -->

    <h2 id="searchTitle">
        Search
    </h2>

    <form id="searchForm">

       <input
    type="text"
    id="searchBox"
    placeholder="Enter item name"
>

        <br>

        <button
            type="submit"
            id="searchButton"
        >
            Search
        </button>

    </form>

    <hr>

    <!-- ================================
         SEARCH RESULTS
         ================================ -->

    <div id="results">
        Enter a search term above
    </div>

    <!-- ================================
         SEARCH FORM BEHAVIOUR
         ================================ -->

    <script>
        document.getElementById("searchForm").addEventListener("submit", function(event) {
            event.preventDefault();
            searchItem();
        });
    </script>

    <!-- ================================
         SCRIPT
         ================================ -->

    <script src="script.js"></script>

    <!-- ================================
         VERSION
         ================================ -->

    <div class="version-label">
        GF-00
    </div>

</body>

</html>
