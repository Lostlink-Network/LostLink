<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - PRJ LostLink</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            width: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
        }

        /* ================================
           TOP BAR
           ================================ */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nexus {
            text-align: left;
        }

        .nexus h1 {
            margin: 0;
            line-height: 1.1;
        }

        .nexus p {
            margin: 0;
            line-height: 1.1;
        }

        /* ================================
           LANGUAGE BUTTONS
           ================================ */

        .language-box {
            display: flex;
            border: 1px solid black;
            margin-left: 10px;
            overflow: hidden;
        }

        .language-box button {
            border: none;
            background: white;
            color: black;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .language-box button.selected {
            background: rgba(25, 118, 210, 0.25);
            color: black;
        }

        /* ================================
           SEARCH
           ================================ */

        #searchBox,
        #categoryFilter {
            display: block;
            width: 70%;
            max-width: 400px;
            padding: 10px;
            margin: 8px 0 14px;
            font-size: 16px;
        }

        #searchButton {
            padding: 10px 16px;
            min-height: 44px;
            font-size: 16px;
            cursor: pointer;
        }

        /* SEARCH RESULTS */
        #results {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            column-gap: 28px;
            row-gap: 16px;
            align-items: start;
            width: 100%;
            margin-top: 0;
            padding: 0;
        }

        /* Box each search result */
        #results .search-result {
            min-width: 0;
            width: 100%;
            padding: 16px;
            border: 1px solid #19386a;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            overflow-wrap: anywhere;
        }

        /* Hide existing separators to avoid duplicate lines */
        #results hr {
            display: none !important;
        }

        /* Images */
        #results img {
            max-width: 100%;
            height: auto;
        }

        /* Mobile: one column */
        @media (max-width: 700px) {
            #results {
                grid-template-columns: minmax(0, 1fr) !important;
                column-gap: 0;
            }
        }

        /* ================================
           VERSION
           ================================ */

        .version-label {
            text-align: center;
            margin-top: 30px;
            padding: 10px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>

    <link rel="stylesheet" href="site-theme.css">
</head>

<body>
    <!-- ================================
         TOP BAR
         ================================ -->

    <div class="top-bar">
        <div class="nexus">
            <h1>
                <a id="pageTitle" href="index.html">LostLink NTW</a>
            </h1>

            <p id="subTitle">
                Student Lost &amp; Found System
            </p>
        </div>

        <div class="language-box">
            <button
                id="enButton"
                type="button"
                onclick="setLanguage('EN')">
                EN
            </button>

            <button
                id="jpButton"
                type="button"
                onclick="setLanguage('JP')">
                JP
            </button>
        </div>
    </div>

    <hr>

    <!-- ================================
         SEARCH
         ================================ -->

    <h2 id="searchTitle">
        Search
    </h2>

    <form id="searchForm">
        <input
            type="text"
            id="searchBox"
            placeholder="Enter item name"
        >

        <label for="categoryFilter" id="categoryLabel">
            Category (Optional):
        </label>

        <select id="categoryFilter" onchange="searchItem()">
            <option value="all">All Categories</option>
            <option value="Stationery">Stationery (文房具)</option>
            <option value="Electronics">Electronics (電子機器)</option>
            <option value="School Supplies">School Supplies (学用品)</option>
            <option value="Bags &amp; Pouches">Bags &amp; Pouches (バッグ・ポーチ)</option>
            <option value="Clothing &amp; Uniforms">Clothing &amp; Uniforms (衣類・制服)</option>
            <option value="Everyday Items">Everyday Items (日用品)</option>
            <option value="Wallets &amp; Cards">Wallets &amp; Cards (財布・カード)</option>
            <option value="Keys">Keys (鍵)</option>
            <option value="Accessories">Accessories (小物・アクセサリー)</option>
            <option value="Sports Equipment">Sports Equipment (運動用具)</option>
            <option value="Other">Other (その他)</option>
        </select>

        <button
            type="submit"
            id="searchButton">
            Search
        </button>

        <hr>
    </form>

    <!-- ================================
         SEARCH RESULTS
         ================================ -->

    <div id="results">
        Enter a search term above
    </div>

    <!-- ================================
         SCRIPT
         ================================ -->

    <script>
        document.getElementById("searchForm").addEventListener("submit", function(event) {
            event.preventDefault();
            searchItem();
        });
    </script>

    <script src="script.js"></script>

    <!-- ================================
         VERSION
         ================================ -->

    <div class="version-label">
        GF-02
    </div>
</body>

</html>
