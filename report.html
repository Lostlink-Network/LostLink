<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report Item - PRJ LostLink</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 16px;
        width: 100%;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
    }

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }
    }

    /* ================================
       TOP BAR
       ================================ */

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
    }

    .nexus {
        text-align: left;
    }

    .nexus h1 {
        margin: 0;
        line-height: 1.1;
    }

    .nexus p {
        margin: 0;
        line-height: 1.1;
    }

    /* ================================
       LANGUAGE BUTTONS
       ================================ */

    .language-box {
        display: flex;
        border: 1px solid black;
        margin-left: 10px;
        overflow: hidden;
    }

    .language-box button {
        border: none;
        background: white;
        color: black;
        padding: 6px 10px;
        font-size: 14px;
        cursor: pointer;
    }

    .language-box button.selected {
        background: rgba(25, 118, 210, 0.25);
        color: black;
    }

    /* ================================
       VERSION
       ================================ */

    .version-label {
        text-align: center;
        margin-top: 30px;
        padding: 10px;
        font-size: 12px;
        opacity: 0.6;
    }

</style>

<link rel="stylesheet" href="site-theme.css">

</head>

<body>

<!-- ================================
     TOP BAR
     ================================ -->

<div class="top-bar">

<div class="nexus">

    <h1>
        <a id="pageTitle" href="index.html">LostLink NTW</a>
    </h1>

    <p id="subTitle">
        Student Lost &amp; Found System
    </p>

</div>

<div class="language-box">

    <button id="enButton"
        onclick="setLanguage('EN')">
        EN
    </button>

    <button id="jpButton"
        onclick="setLanguage('JP')">
        JP
    </button>

</div>

</div>

<hr>

<h2 id="reportTitle">
    Report an Item
</h2>

<p id="guidelineInstruction">
    Please read the submission guidelines before submitting:
</p>

<p>
    <a class="nav-button"
       id="guidelineLink"
       href="documents/LostLink%20NTW%20%E2%80%94%20Submission%20Guidelines.pdf"
       target="_blank"
       rel="noopener noreferrer">
        Submission Guidelines (PDF)
    </a>
</p>

<p>
    <a class="nav-button"
       id="reportFormLink"
       href="https://docs.google.com/forms/d/e/1FAIpQLSdjmCGYl_BlAd7tXyWs6W6go0oQRUPD14rmbxW1Y6hBBtdBGQ/viewform?usp=header"
       target="_blank"
       rel="noopener noreferrer">
        Open Lost &amp; Found Report Form
    </a>
</p>

<div class="version-label">

GF-02

</div>

<script src="script.js"></script>

</body>

</html>
