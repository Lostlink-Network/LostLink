<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LostLink Network System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

<style>

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: auto;
        overflow-anchor: none;
    }

    body {
        margin: 0;
        padding: 16px;
        width: 100%;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
    }

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }
    }

    /* ================================
       TOP BAR
       ================================ */

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
    }

    .nexus {
        text-align: left;
    }

    .nexus h1 {
        margin: 0;
        line-height: 1.1;
    }

    .nexus p {
        margin: 0;
        line-height: 1.1;
    }

    /* ================================
       LANGUAGE BUTTONS
       ================================ */

    .language-box {
        display: flex;
        border: 1px solid black;
        margin-left: 10px;
        overflow: hidden;
    }

    .language-box button {
        border: none;
        background: white;
        color: black;
        padding: 6px 10px;
        font-size: 14px;
        cursor: pointer;
    }

    .language-box button.selected {
        background: rgba(25, 118, 210, 0.25);
        color: black;
    }

    /* ================================
       INFORMATION
       ================================ */

    .info-group p {
        margin: 0;
    }

    .info-group + .info-group {
        margin-top: 15px;
    }

    /* ================================
       POWERED BY
       ================================ */

    .powered-by {
        --spacing: 5px;
    }

    .powered-by p {
        margin-bottom: var(--spacing);
    }

    .powered-by h1 {
        margin-top: 0;
    }

    /* ================================
       NEXUS
       ================================ */

    .nexus-section h1 {
        margin-bottom: 0;
    }

    .nexus-section p {
        margin-top: 0;
    }

    /* ================================
       VERSION
       ================================ */

    .version-label {
        text-align: center;
        margin-top: 30px;
        padding: 10px;
        font-size: 12px;
        opacity: 0.6;
    }

</style>

<link rel="stylesheet" href="site-theme.css">

<script>

    // Prevent mobile browsers from restoring an old scroll position
    if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
    }

</script>

</head>

<body>

<!-- ================================
     TOP BAR
     ================================ -->

<div class="top-bar">

<div class="nexus">

    <h1>
        <a id="pageTitle" href="index.html">LostLink NTW</a>
    </h1>

    <p id="subTitle">
        Student Lost &amp; Found System
    </p>

</div>

<div class="language-box">

    <button id="enButton"
        onclick="setLanguage('EN')">
        EN
    </button>

    <button id="jpButton"
        onclick="setLanguage('JP')">
        JP
    </button>

</div>

</div>

<hr>

<h1>Here LostLink, We value your Privacy and Security</h1>
<p>We Protect Your Privacy and Ensure the Security of Your Data</p>
<p>We ensure we take no personal data from you and your device</p>



<div class="version-label">

GF-02

</div>

<script src="script.js"></script>

<script>

    // Force the page to the top after loading
    window.addEventListener("load", function () {

        setTimeout(function () {

            window.scrollTo(0, 0);

        }, 100);

    });

</script>

</body>

</html>
